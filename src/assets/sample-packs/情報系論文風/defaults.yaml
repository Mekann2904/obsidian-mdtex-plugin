# 情報系論文風テンプレート用 defaults file
#
# 実在学会の公式テンプレートではなく、情報処理学会・人工知能学会などの
# 和文情報系論文に近い見た目を再現する汎用サンプル。

# --- MdTex パックメタ（Pandoc は未知キーを無視・MdTex だけが読む）---
# 設定画面のパック選択時に表示される説明・前提・推奨設定。書き方は SKILL.md 参照。
_mdtex:
  title: "情報系論文風（LuaLaTeX）"
  description: "情報処理学会・AI学会風の二段組論文。A4横組。LuaLaTeX 必要。"
  engine: lualatex
  requires: []
  recommendedProfile:
    citationMode: none
    latexEngine: lualatex

from: markdown+raw_tex+raw_html+fenced_divs+raw_attribute+fenced_code_attributes
to: pdf
pdf-engine: lualatex
standalone: true

template: ${.}/info-paper.tex
include-in-header: ${.}/preamble.tex

# Markdown table は Pandoc 標準では longtable になり、twocolumn と相性が悪い。
# このサンプルでは単純な表を table + tabular に変換する。
filters:
  - ${.}/simple-table.lua

variables:
  documentclass: ltjsarticle
  classoption: "twocolumn, a4paper"
  fontsize: 10pt
  geometry:
    - top=20mm
    - bottom=22mm
    - left=18mm
    - right=18mm
    - columnsep=7mm

# 参考文献を BibTeX/citeproc で処理したい場合は、必要に応じて以下を追加する。
# citeproc: true
# bibliography: references.bib
